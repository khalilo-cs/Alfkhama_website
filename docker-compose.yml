# One command production setup with automatic HTTPS (Let's Encrypt) once your domain points at this server:
#   DOMAIN=shop.your-domain.com ADMIN_PASSWORD='a-strong-password-12+' docker compose up -d --build
# The first start creates the admin account from ADMIN_PASSWORD (or prints a generated one: docker compose logs app).
# ---- الخدمات ----
# خدمتان: app (خادم المتجر نفسه) و caddy (وكيل عكسي يتولى HTTPS وشهادات Let's Encrypt تلقائيًا).
services:
  # ---- خدمة المتجر ----
  # لا تفتح منفذًا للخارج؛ الوصول إليها يتم عبر caddy فقط داخل شبكة compose.
  app:
    build: .
    restart: unless-stopped
    # ---- متغيرات التشغيل ----
    # الأسرار (كلمة المرور ومفاتيح S3) تأتي من بيئة الطرفية أو ملف .env، ولا تُكتب في هذا الملف.
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # عنوان الموقع العام؛ العلامة :? توقف التشغيل برسالة خطأ إن لم يُضبط DOMAIN.
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN to your domain name}
      SITE_READY_DEFAULT: ${SITE_READY_DEFAULT:-1}
      # اختياري: نسخ لقطات إلى مخزن S3 خاص (R2 / B2 / S3 / MinIO). فارغة = معطّل. ضعها في ملف .env لا في Git.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-alfakhama/}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-120}
    # ---- التخزين الدائم ----
    # volume مسمّى (store-data) يبقى حتى بعد إعادة بناء الحاوية، فتبقى القاعدة والصور.
    volumes:
      - store-data:/data        # database, uploads and daily backups (/data/backups)
  # ---- خدمة Caddy (الوكيل العكسي) ----
  # تستمع على المنفذين 80 و443 وتمرر الطلبات إلى app؛ إعدادها في deploy/Caddyfile.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      # الإعداد للقراءة فقط (ro)، وcaddy-data يحفظ الشهادات كي لا تُطلب من جديد عند كل إعادة تشغيل.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
# ---- الأقراص المسماة ----
volumes:
  store-data:
  caddy-data:
  caddy-config:
