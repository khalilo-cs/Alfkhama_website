# ---- التكامل المستمر (CI) على GitHub Actions ----
# يشغَّل عند كل push وكل pull request، ويتحقق من سلامة الخادم وتطبيق أندرويد قبل الدمج.
name: CI
on:
  push:
  pull_request:
# ---- المهام ----
jobs:
  # مهمة الخادم: تشغّل اختبارات بايثون (unittest) بمفسّر معزول -I.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -I -m unittest discover -s tests -v
  # مهمة أندرويد: تشغّل اختبارات الوحدة وفحص lint للتطبيق، ولها مهلة 30 دقيقة كي لا تعلق للأبد.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # أجهزة GitHub الجاهزة تحمل Android SDK مثبّتًا مسبقًا في ANDROID_HOME، فنستخدمه مباشرة
      # بدل إضافة تثبيت خارجية (كانت تفشل في هذه الخطوة قبل الوصول إلى كود التطبيق).
      - name: تجهيز حزم Android SDK المطلوبة
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      # يخبر Gradle بمكان Android SDK عبر ملف local.properties (الملف نفسه مستبعد من Git).
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      # اختبارات الوحدة وفحص lint لنسخة debug داخل مجلد android.
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug
        working-directory: android
