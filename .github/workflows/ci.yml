name: CI
on:
  push:
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -I -m unittest discover -s tests -v
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # أجهزة GitHub الجاهزة تحمل Android SDK مثبّتًا مسبقًا في ANDROID_HOME، فنستخدمه مباشرة
      # بدل إضافة تثبيت خارجية (كانت تفشل في هذه الخطوة قبل الوصول إلى كود التطبيق).
      - name: تجهيز حزم Android SDK المطلوبة
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug
        working-directory: android
